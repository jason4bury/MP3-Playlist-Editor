services:

  mp3-playlist-editor:
    image: jason4bury/mp3-playlist-editor
    container_name: mp3-playlist-editor
    labels:
      - home.group=Music
    # App settings come from E:\Docker_PC\env\mp3-playlist-editor\.env: APP_PASSWORD,
    # DISABLE_LOGIN, TRUST_PROXY.
    env_file:
      - ${ENV}/mp3-playlist-editor/.env
    # Fixed container-side values. These override anything with the same name in the
    # .env file.
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      # Playlists, attached MP3s, cover art and sessions.
      - ${CONFIGS}/mp3-playlist-editor:/app/data
    ports:
      - 3002:3000
    restart: unless-stopped
