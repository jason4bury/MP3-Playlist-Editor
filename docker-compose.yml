# MP3 Playlist Editor. Copy .env.example to .env next to this file, fill it in, then run:
#   docker compose up -d
# Every ${VALUE} below comes from that .env, so .env is normally the only file you edit.
services:

  mp3-playlist-editor:
    image: jason4bury/mp3-playlist-editor:${MP3_PLAYLIST_EDITOR_TAG:-latest}
    container_name: mp3-playlist-editor
    # Passes the app settings in .env (APP_PASSWORD, DISABLE_LOGIN, TRUST_PROXY) to the container.
    env_file:
      - .env
    # Fixed container-side values. These override anything with the same name in .env.
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      # Playlists, attached MP3s, cover art and sessions. A named Docker volume unless
      # DATA_HOST_DIR is set.
      - ${DATA_HOST_DIR:-mp3-playlist-editor-data}:/app/data
    ports:
      - "${PORT:-3002}:3000"
    restart: unless-stopped

volumes:
  mp3-playlist-editor-data:
