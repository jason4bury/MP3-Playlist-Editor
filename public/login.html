<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · MP3 Playlist Editor</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1b2430; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .box { background: #efe7d6; padding: 30px; border-radius: 12px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .brand img { width: 48px; height: 48px; }
  h1 { font-family: Georgia, serif; font-size: 20px; line-height: 1.2; margin: 0; color: #1b2430; }
  .pw-row { position: relative; margin-bottom: 10px; }
  .pw-row input { width: 100%; box-sizing: border-box; padding: 10px 40px 10px 10px; border-radius: 6px; border: 1px solid rgba(27,36,48,0.25); font-family: inherit; font-size: 13px; }
  .pw-toggle { position: absolute; top: 0; right: 0; width: 36px; height: 100%; background: none; border: none; padding: 0; cursor: pointer; color: rgba(27,36,48,0.6); font-size: 14px; }
  .pw-toggle:hover { color: #1b2430; }
  button[type="submit"] { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1b2430; color: #efe7d6; font-family: inherit; font-size: 13px; cursor: pointer; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  .err { color: #b3492f; font-size: 12px; margin: 0 0 10px; min-height: 14px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <div class="brand">
      <img src="/icon.png" alt="" />
      <h1>MP3 Playlist Editor</h1>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="pw-row">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
      <button type="button" class="pw-toggle" id="pw-toggle" title="Show password" aria-label="Show password">👁</button>
    </div>
    <button type="submit" id="submit">Sign in</button>
  </form>
  <script src="/login.js"></script>
</body>
</html>
